
name: Simulator regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  simulator:
    name: Simulator tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run simulator suites
        run: python -m robot --outputdir results/simulator tests/common/ tests/optional/ tests/simulator/

      - name: Upload Robot reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: simulator-robot-reports
          path: results/simulator/
          if-no-files-found: warn
