name: Simulator regression
on:
  push:
  pull_request:
jobs:
  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run simulator suites
        run: python -m robot --outputdir results/simulator tests/common/ tests/optional/ tests/simulator/
      - name: Upload Robot reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-robot-reports
          path: results/simulator/
